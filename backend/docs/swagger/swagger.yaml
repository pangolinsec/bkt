definitions:
  api.MoveFolderRequest:
    properties:
      destination_prefix:
        type: string
      source_prefix:
        type: string
    required:
    - destination_prefix
    - source_prefix
    type: object
  api.MoveObjectRequest:
    properties:
      destination_key:
        type: string
      source_key:
        type: string
    required:
    - destination_key
    - source_key
    type: object
  api.RenameObjectRequest:
    properties:
      new_name:
        type: string
      source_key:
        type: string
    required:
    - new_name
    - source_key
    type: object
  api.presignRequest:
    properties:
      expires_in:
        description: seconds; default 900, capped at 604800
        type: integer
      key:
        type: string
    required:
    - key
    type: object
  models.AccessKey:
    properties:
      access_key:
        type: string
      created_at:
        type: string
      expires_at:
        description: nil = never expires
        type: string
      id:
        type: string
      is_active:
        type: boolean
      last_used_at:
        type: string
      name:
        description: Human label to tell keys apart
        type: string
      read_only:
        description: Deny mutating S3 operations
        type: boolean
      status:
        description: |-
          Status is computed for API responses (not stored): "active", "expired"
          or "revoked" (deactivated, or an STS credential whose session was
          revoked). is_active alone doesn't say whether a key still works.
        type: string
      temporary:
        description: 'bkt-STS short-lived credential: excluded from the key limit,
          hard-deleted after expiry'
        type: boolean
      user:
        allOf:
        - $ref: '#/definitions/models.User'
        description: Relationships
      user_id:
        type: string
    type: object
  models.AuthResponse:
    properties:
      refresh_token:
        type: string
      token:
        type: string
      user:
        $ref: '#/definitions/models.User'
    type: object
  models.Bucket:
    properties:
      created_at:
        type: string
      id:
        type: string
      is_public:
        type: boolean
      lifecycle:
        description: |-
          Lifecycle holds the bucket's lifecycle configuration as JSON (see
          LifecycleConfig); nil = no lifecycle rules.
        type: string
      name:
        type: string
      objects:
        items:
          $ref: '#/definitions/models.Object'
        type: array
      owner:
        allOf:
        - $ref: '#/definitions/models.User'
        description: Relationships
      owner_id:
        type: string
      quota_bytes:
        description: |-
          QuotaBytes caps the total size of CURRENT objects in the bucket
          (version storage is not counted). 0 = unlimited.
        type: integer
      region:
        type: string
      replicate_to:
        description: |-
          ReplicateTo mirrors this bucket's current objects into another bkt
          bucket (periodic sync; the target is fully managed by replication).
        type: string
      retention_days:
        description: |-
          RetentionDays (WORM-lite): while set, no version of any object can be
          permanently removed until it is older than this many days. Requires
          versioning to be enabled. Plain deletes still create markers (data is
          preserved); version-addressed deletes, lifecycle purges, and bucket
          deletion are refused for retained data. 0 = off.
        type: integer
      s3_config:
        $ref: '#/definitions/models.S3Configuration'
      s3_config_id:
        description: 'Optional: specific S3 config to use'
        type: string
      storage_backend:
        description: '"local" or "s3"'
        type: string
      updated_at:
        type: string
      versioning:
        description: |-
          Versioning state: "" (never enabled), "enabled", or "suspended".
          Suspended keeps existing versions browsable but stops creating new ones
          (a documented simplification of AWS's null-version semantics).
        type: string
      webhook_events:
        type: string
      webhook_url:
        description: |-
          Webhook event notifications: POSTed as JSON to WebhookURL for the event
          types in WebhookEvents (csv of "created","removed"). Empty URL = off.
        type: string
    type: object
  models.CreateBucketRequest:
    properties:
      is_public:
        type: boolean
      name:
        maxLength: 63
        minLength: 3
        type: string
      region:
        type: string
      s3_config_id:
        description: 'Optional: specific S3 config to use'
        type: string
      storage_backend:
        description: '"local" or "s3"'
        type: string
    required:
    - name
    type: object
  models.CreatePolicyRequest:
    properties:
      description:
        type: string
      document:
        type: string
      name:
        type: string
    required:
    - document
    - name
    type: object
  models.CreateS3ConfigRequest:
    properties:
      access_key_id:
        type: string
      bucket_prefix:
        type: string
      endpoint:
        type: string
      force_path_style:
        type: boolean
      is_default:
        type: boolean
      name:
        maxLength: 100
        minLength: 3
        type: string
      region:
        type: string
      secret_access_key:
        type: string
      use_ssl:
        type: boolean
    required:
    - access_key_id
    - endpoint
    - name
    - region
    - secret_access_key
    type: object
  models.ErrorResponse:
    properties:
      error:
        type: string
      message:
        type: string
    type: object
  models.Group:
    properties:
      created_at:
        type: string
      description:
        type: string
      id:
        type: string
      name:
        type: string
      policies:
        items:
          $ref: '#/definitions/models.Policy'
        type: array
      sso_groups:
        description: |-
          SSOGroups are the identity-provider group names linked to this group
          (from GroupSSOLink; not a column). SSO users whose IdP groups match any
          of them (case-insensitively) are made members at sign-in, and removed
          when they no longer match. A group with at least one link is
          "SSO-managed"; groups without links are purely manual.
        items:
          type: string
        type: array
      updated_at:
        type: string
      users:
        items:
          $ref: '#/definitions/models.User'
        type: array
    type: object
  models.LoginRequest:
    properties:
      password:
        maxLength: 1024
        type: string
      username:
        maxLength: 255
        type: string
    required:
    - password
    - username
    type: object
  models.Object:
    properties:
      bucket:
        allOf:
        - $ref: '#/definitions/models.Bucket'
        description: Relationships
      bucket_id:
        type: string
      content_type:
        type: string
      created_at:
        type: string
      etag:
        type: string
      id:
        type: string
      key:
        description: Object name/path
        type: string
      metadata:
        description: x-amz-meta-* user metadata (JSON map, nullable)
        type: string
      sha256:
        description: SHA256 hash of content
        type: string
      size:
        type: integer
      tags:
        description: S3 object tags (JSON map, nullable)
        type: string
      updated_at:
        type: string
      version_id:
        description: |-
          VersionID of the CURRENT version ("" = written while unversioned, the
          S3 "null" version). Non-current versions live in object_versions.
        type: string
    type: object
  models.Policy:
    properties:
      created_at:
        type: string
      description:
        type: string
      document:
        description: IAM policy JSON
        type: string
      id:
        type: string
      name:
        type: string
      updated_at:
        type: string
      users:
        description: Relationships
        items:
          $ref: '#/definitions/models.User'
        type: array
    type: object
  models.RegisterRequest:
    properties:
      email:
        type: string
      password:
        minLength: 8
        type: string
      username:
        maxLength: 50
        minLength: 3
        type: string
    required:
    - email
    - password
    - username
    type: object
  models.S3Configuration:
    properties:
      access_key_id:
        type: string
      bucket_prefix:
        type: string
      buckets:
        description: Relationships
        items:
          $ref: '#/definitions/models.Bucket'
        type: array
      created_at:
        type: string
      endpoint:
        type: string
      force_path_style:
        type: boolean
      id:
        type: string
      is_default:
        type: boolean
      name:
        type: string
      region:
        type: string
      updated_at:
        type: string
      use_ssl:
        type: boolean
    type: object
  models.SuccessResponse:
    properties:
      data: {}
      message:
        type: string
    type: object
  models.UpdatePolicyRequest:
    properties:
      description:
        type: string
      document:
        type: string
      name:
        type: string
    type: object
  models.UpdateS3ConfigRequest:
    properties:
      access_key_id:
        type: string
      bucket_prefix:
        description: 'BucketPrefix: omitted/null = unchanged, "" = clear the prefix.'
        type: string
      endpoint:
        type: string
      force_path_style:
        type: boolean
      is_default:
        type: boolean
      name:
        type: string
      region:
        type: string
      secret_access_key:
        description: Only update if provided
        type: string
      use_ssl:
        type: boolean
    type: object
  models.User:
    properties:
      access_keys:
        items:
          $ref: '#/definitions/models.AccessKey'
        type: array
      buckets:
        description: Relationships
        items:
          $ref: '#/definitions/models.Bucket'
        type: array
      created_at:
        type: string
      email:
        type: string
      group_policy_count:
        type: integer
      id:
        type: string
      is_admin:
        type: boolean
      is_locked:
        description: Account lock status
        type: boolean
      policies:
        items:
          $ref: '#/definitions/models.Policy'
        type: array
      policy_count:
        description: |-
          Computed for the admin user list (not stored): policies attached directly
          (manual assignments and SSO claim sync alike) and distinct policies
          inherited through group membership.
        type: integer
      policy_ids:
        description: directly attached policy IDs
        items:
          type: string
        type: array
      sso_email:
        description: Email from SSO (may differ from Email)
        type: string
      sso_id:
        description: Unique ID from SSO provider
        type: string
      sso_provider:
        description: SSO fields
        type: string
      updated_at:
        type: string
      username:
        type: string
    type: object
info:
  contact: {}
paths:
  /api/access-keys:
    get:
      consumes:
      - application/json
      description: Returns all access keys (active and inactive) belonging to the
        authenticated user. Secret key hashes are never returned.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/models.AccessKey'
            type: array
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/models.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/models.ErrorResponse'
      security:
      - BearerAuth: []
      summary: List access keys
      tags:
      - access-keys
    post:
      consumes:
      - application/json
      description: Generates a new cryptographically secure access key and secret
        key pair for the authenticated user. The secret key is returned only once
        and cannot be retrieved again. Maximum 5 active keys per user.
      produces:
      - application/json
      responses:
        "201":
          description: Access key and secret key (secret shown only once)
          schema:
            type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/models.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/models.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/models.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Generate a new access key
      tags:
      - access-keys
  /api/access-keys/{id}:
    delete:
      consumes:
      - application/json
      description: Deactivates an access key (soft delete). Users can revoke their
        own keys; admins can revoke any key. The key record is retained for audit
        purposes.
      parameters:
      - description: Access Key ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.SuccessResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/models.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/models.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/models.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/models.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/models.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Revoke an access key
      tags:
      - access-keys
  /api/access-keys/stats:
    get:
      consumes:
      - application/json
      description: Returns the count of active and total access keys for the authenticated
        user, along with the maximum allowed keys.
      produces:
      - application/json
      responses:
        "200":
          description: Access key statistics
          schema:
            type: object
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/models.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Get access key statistics
      tags:
      - access-keys
  /api/audit:
    get:
      consumes:
      - application/json
      description: Admin-only. Returns audit log entries, filterable by user, action,
        resource type, status, and time range.
      parameters:
      - description: Filter by user ID
        in: query
        name: user_id
        type: string
      - description: Filter by action
        in: query
        name: action
        type: string
      - description: Filter by resource type
        in: query
        name: resource_type
        type: string
      - description: Filter by status (success/failure/denied)
        in: query
        name: status
        type: string
      - description: Start time (RFC3339)
        in: query
        name: start
        type: string
      - description: End time (RFC3339)
        in: query
        name: end
        type: string
      - description: Max results (default 100, max 500)
        in: query
        name: limit
        type: integer
      - description: Offset for pagination
        in: query
        name: offset
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/models.ErrorResponse'
      security:
      - BearerAuth: []
      summary: List audit logs
      tags:
      - audit
  /api/auth/login:
    post:
      consumes:
      - application/json
      description: 'Authenticates a user with username and password and returns JWT
        access and refresh tokens. The refresh token is also set in the httpOnly bkt_refresh
        cookie; with the X-Bkt-Client: console header it is omitted from the body.'
      parameters:
      - description: Login credentials
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/models.LoginRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.AuthResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/models.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/models.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/models.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/models.ErrorResponse'
      summary: Login with username and password
      tags:
      - auth
  /api/auth/logout:
    post:
      consumes:
      - application/json
      description: Revokes the current access token, its sibling refresh token, and
        any refresh token presented in the body or the bkt_refresh console cookie;
        always clears the cookie.
      parameters:
      - description: Optional refresh token to also revoke
        in: body
        name: request
        schema:
          type: object
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.SuccessResponse'
      security:
      - BearerAuth: []
      summary: Logout and revoke tokens
      tags:
      - auth
  /api/auth/refresh:
    post:
      consumes:
      - application/json
      description: 'Exchanges a refresh token (from the JSON body, or from the bkt_refresh
        cookie together with the X-Bkt-Client: console header) for a new access token
        and a rotated refresh token. The rotated refresh token is set in the cookie
        and, for non-console clients, returned in the body.'
      parameters:
      - description: Refresh token (optional when using the bkt_refresh cookie)
        in: body
        name: request
        schema:
          type: object
      produces:
      - application/json
      responses:
        "200":
          description: New access token
          schema:
            type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/models.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/models.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/models.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/models.ErrorResponse'
      summary: Refresh access token
      tags:
      - auth
  /api/auth/register:
    post:
      consumes:
      - application/json
      description: 'Creates a new user account and returns JWT access and refresh
        tokens. The refresh token is also set in the httpOnly bkt_refresh cookie;
        with the X-Bkt-Client: console header it is omitted from the body. Registration
        must be enabled in server configuration.'
      parameters:
      - description: Registration credentials
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/models.RegisterRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/models.AuthResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/models.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/models.ErrorResponse'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/models.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/models.ErrorResponse'
      summary: Register a new user
      tags:
      - auth
  /api/buckets:
    get:
      consumes:
      - application/json
      description: Returns all buckets the authenticated user has access to. Admins
        see all buckets; regular users see only buckets permitted by their attached
        policies.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/models.Bucket'
            type: array
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/models.ErrorResponse'
      security:
      - BearerAuth: []
      summary: List buckets
      tags:
      - buckets
    post:
      consumes:
      - application/json
      description: Admin-only. Creates a new storage bucket. If the bucket already
        exists in the storage backend, it is linked rather than re-created.
      parameters:
      - description: Bucket configuration
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/models.CreateBucketRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/models.Bucket'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/models.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/models.ErrorResponse'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/models.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/models.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Create a bucket
      tags:
      - buckets
  /api/buckets/{name}:
    delete:
      consumes:
      - application/json
      description: Admin-only. Local buckets are deleted with their contents. S3-backed
        buckets require no live objects, versions, or uploads. Only BKT hidden orphan
        blobs are reclaimed; public upstream keys and native versioning require manual
        cleanup.
      parameters:
      - description: Bucket name
        in: path
        name: name
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.SuccessResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/models.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/models.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/models.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Delete a bucket
      tags:
      - buckets
    get:
      consumes:
      - application/json
      description: Returns the details of a specific bucket by name. Requires admin
        or any of s3:ListBucket, s3:GetBucketLocation, s3:GetBucketPolicy on the bucket.
        Non-admins get a reduced view (no s3_config_id or owner record; webhook URL/events
        and replication target only with the permission to change them).
      parameters:
      - description: Bucket name
        in: path
        name: name
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.Bucket'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/models.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/models.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/models.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Get a bucket
      tags:
      - buckets
  /api/buckets/{name}/deleted-objects:
    get:
      description: Lists keys under a prefix whose latest version is a delete marker
        (deleted but recoverable on versioned buckets), with the marker's version
        id and the size/last-modified of the newest surviving version. Requires ListBucket
        on the bucket.
      parameters:
      - description: Bucket name
        in: path
        name: name
        required: true
        type: string
      - description: Key prefix
        in: query
        name: prefix
        type: string
      - description: Page size (1-1000, default 1000)
        in: query
        name: max_keys
        type: integer
      - description: Last key of the previous page
        in: query
        name: continuation_token
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            type: object
      security:
      - BearerAuth: []
      summary: List deleted objects
      tags:
      - buckets
  /api/buckets/{name}/folders:
    delete:
      description: Deletes every current object under a folder prefix (at most 10000).
        Versioned buckets get delete markers. Objects under retention or without DeleteObject
        permission are skipped and counted.
      parameters:
      - description: Bucket name
        in: path
        name: name
        required: true
        type: string
      - description: Folder prefix, ending in '/'
        in: query
        name: prefix
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: '{deleted, skipped_retention, denied}'
          schema:
            type: object
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/models.ErrorResponse'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/models.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Delete a folder
      tags:
      - buckets
    get:
      description: Counts the current objects under a folder prefix (including a "<prefix>"
        marker object). Requires ListBucket on the bucket.
      parameters:
      - description: Bucket name
        in: path
        name: name
        required: true
        type: string
      - description: Folder prefix, ending in '/'
        in: query
        name: prefix
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            type: object
      security:
      - BearerAuth: []
      summary: Summarize a folder
      tags:
      - buckets
